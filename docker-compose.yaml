services:
  selenium:
    image: selenium/standalone-firefox:111.0.1-20261120
    container_name: selenium-firefox
    shm_size: 1gb
    environment:
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"
    volumes:
      - ./sessions:/sessions
    restart: unless-stopped
